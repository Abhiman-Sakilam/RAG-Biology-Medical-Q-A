# RAG config template. Copy to project root as config.toml.
#
# --- LLM model (used with GROQ_API_KEY or OPENAI_API_KEY in setup/.env) ---
#
# Groq (GROQ_API_KEY, https://console.groq.com/docs/models):
#   Production: llama-3.3-70b-versatile, llama-3.1-8b-instant, openai/gpt-oss-120b,
#               openai/gpt-oss-20b, meta-llama/llama-guard-4-12b
#   Systems:    groq/compound, groq/compound-mini
#   Preview:    meta-llama/llama-4-maverick-17b-128e-instruct, qwen/qwen3-32b, etc.
#   Full list:  GET https://api.groq.com/openai/v1/models (with Authorization: Bearer $GROQ_API_KEY)
#
# OpenAI (OPENAI_API_KEY + OPENAI_BASE_URL unset or https://api.openai.com/v1):
#   gpt-4o, gpt-4o-mini, gpt-4-turbo, gpt-4, gpt-3.5-turbo
#   See: https://platform.openai.com/docs/models

[retrieval]
top_k = 5

[llm]
model = "gpt-4o-mini"
max_tokens = 512
temperature = 0.2
